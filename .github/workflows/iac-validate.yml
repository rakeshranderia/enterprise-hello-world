name: IaC Validate

on:
  push:
    paths:
      - "infrastructure/**"
      - ".github/workflows/iac-validate.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/iac-validate.yml"

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI Bicep
        run: |
          az bicep install
          az bicep version

      - name: Build Bicep
        run: az bicep build --file infrastructure/bicep/main.bicep
